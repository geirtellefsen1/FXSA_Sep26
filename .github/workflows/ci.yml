name: ci
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: fx, POSTGRES_PASSWORD: fx, POSTGRES_DB: fxpms }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fx -d fxpms" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DSN: postgresql://fx:fx@localhost:5432/fxpms
      FXPMS_DSN: postgresql://fx:fx@localhost:5432/fxpms
      TEST_ADMIN_DSN: postgresql://fx:fx@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e tools/zoho-import
      - run: db/apply.sh
      - run: cd tools/zoho-import && python tests/test_e2e.py
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
